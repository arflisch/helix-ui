# Builds the solution on every push and pull request.
# Publishes Helix.Blazor and Helix.Wpf to nuget.org when a version tag is pushed (e.g. v0.1.0).
# One-time setup: add your nuget.org API key as the repository secret NUGET_API_KEY.

name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # WPF compiles on Linux thanks to EnableWindowsTargeting (it only runs on Windows).
      - name: Build
        run: dotnet build Helix.slnx -c Release

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          VERSION="${PACKAGE_VERSION:-0.0.0-ci.${GITHUB_RUN_NUMBER}}"
          dotnet pack src/Helix.Blazor -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helix.Wpf -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack templates/Helix.Templates.csproj -c Release -o artifacts -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
