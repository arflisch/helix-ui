<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Helix UI</title>
    <meta name="description" content="Blazor and WPF components that look good by default and are simple to customize." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="_content/Helix.Blazor/helix.css" />
    <link rel="stylesheet" href="app.css" />
    <style>
        /* Shown while the app downloads (a few seconds the first time, then cached). */
        .boot { min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; color: #71717a; background: #fafafa; }
        .boot__dot { width: 36px; height: 36px; border-radius: 10px; background: #4f46e5; margin: 0 auto 14px; animation: boot 1s ease-in-out infinite alternate; }
        @keyframes boot { to { transform: scale(.82); opacity: .6; } }
        @media (prefers-color-scheme: dark) { .boot { background: #09090b; color: #a1a1aa; } }
        @media (prefers-reduced-motion: reduce) { .boot__dot { animation: none; } }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot" role="status">
            <div>
                <div class="boot__dot"></div>
                Loading Helix UI…
            </div>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
